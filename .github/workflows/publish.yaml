name: Build package / release

on:
  # On PR commits, check the build completes without error.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v10.2.0
      with: { python-version: "3.14" }

    - name: Build
      run: uv build

  release:
    if: github.event_name == 'push'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v10.2.0
      with: { python-version: "3.14" }

    - name: Read version
      id: version
      run: |
        version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=v$version" >> "$GITHUB_OUTPUT"

    - name: Check whether this version is already released
      id: tag
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}"; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build release distributions
      if: steps.tag.outputs.exists == 'false'
      run: uv build

    - name: Create GitHub Release
      if: steps.tag.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh release create "${{ steps.version.outputs.tag }}" dist/*
        --target "${{ github.sha }}"
        --title "${{ steps.version.outputs.tag }}"
        --generate-notes
