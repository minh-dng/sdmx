name: Build docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Deploy to the same gh-pages environment previously used by sources.yaml;
# the Sphinx site replaces the source-test report as the Pages content.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  python-version: "3.14"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up uv, Python
      uses: astral-sh/setup-uv@v8.0.0
      with:
        activate-environment: true
        python-version: ${{ env.python-version }}

    - name: Install the package and docs dependencies
      run: uv pip install --editable '.[docs]'

    - name: Build HTML documentation
      run: make -C doc html

    - name: Upload docs as a pages artifact
      uses: actions/upload-pages-artifact@v4
      with: { path: doc/_build/html }

  # This job is as described at https://github.com/actions/deploy-pages
  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

    environment:
      name: gh-pages
      url: ${{ steps.deployment.outputs.page_url }}
