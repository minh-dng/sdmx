name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:  # 05:00 UTC = 06:00 CET = 07:00 CEST
  - cron: "0 5 * * *"

# Cancel previous runs that have not completed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      matrix:
        os:
        - macos-latest
        - ubuntu-latest
        - windows-latest
        python-version:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"

      fail-fast: false

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-py${{ matrix.python-version }}
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv, Python
      uses: astral-sh/setup-uv@v10.2.0
      with:
        activate-environment: true
        python-version: ${{ matrix.python-version }}

    - name: Install the package and dependencies
      run: uv pip install '.[tests]'

    - name: Get the sdmx cache directory
      id: sdmx-cache
      run: echo "dir=$(uv run --no-sync python -c 'import platformdirs; print(platformdirs.user_cache_path("sdmx"))')" >> "$GITHUB_OUTPUT"
      shell: bash

    # Rotate the key weekly, so that cached test specimens are refreshed regularly
    - name: Get the ISO week for the cache key
      id: week
      run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"
      shell: bash

    # Warm cache for the SDMX-ML schema zipballs, so that the default test suite needs
    # no large downloads
    - name: Cache sdmx test data and schemas
      uses: actions/cache@v5
      with:
        path: ${{ steps.sdmx-cache.outputs.dir }}
        key: ${{ runner.os }}-sdmx-cache-${{ steps.week.outputs.week }}

    - name: Run pytest
      run: |
        # Fetch test data only when not restored from a cache that contains a
        # completed checkout, so that most runs need no network access; the cache is
        # refreshed by the first run of each week
        args=(--color=yes --durations=20 -ra --verbose --cov-report=xml --numprocesses=auto)
        data_dir="${{ steps.sdmx-cache.outputs.dir }}/test-data"
        if ! git -C "$data_dir" rev-parse HEAD &>/dev/null ||
           ! git -C "$data_dir" diff --quiet HEAD --; then
          # Only this disposable CI checkout: fetch does not restore deleted files
          # or overwrite modified files in an existing checkout.
          rm -rf -- "$data_dir"
          args+=(--sdmx-fetch-data)
        fi
        uv run --no-sync pytest "${args[@]}"
      shell: bash

    - name: Upload test coverage to Codecov.io
      uses: codecov/codecov-action@v7

  pre-commit:
    name: Code quality

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.2.0
      with: { python-version: "3.14" }
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: ${{ github.job }}|${{ hashFiles('.pre-commit-config.yaml') }}
        lookup-only: ${{ github.event_name == 'schedule' }}
        # lookup-only: true
    - name: Run pre-commit
      run: uvx pre-commit run --all-files --show-diff-on-failure --color=always

  # Scheduled only: live-network tests are too flaky to gate push/PR builds. A failure
  # here does not fail the run (continue-on-error) and so does not trigger notifications.
  network:
    name: Network tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v8.0.0
      with:
        activate-environment: true
        python-version: "3.14"
    - name: Install the package and dependencies
      run: uv pip install .[tests]
    - name: Run tests marked 'network'
      continue-on-error: true
      run: |
        uv run --no-sync \
          pytest \
          -m "network and not source" \
          --sdmx-fetch-data \
          --color=yes --durations=20 -ra --verbose \
          --cov-report=xml \
          --numprocesses=auto
      shell: bash
    - name: Upload test coverage to Codecov.io
      uses: codecov/codecov-action@v6
